<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>REDDY | Cricket Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050b19;
    --blue: #1769ff;
    --cyan: #36c5ff;
    --white: #ffffff;
}

body {
    width: 100%;
    min-height: 100svh;
    background:
        radial-gradient(ellipse at 50% 20%, #102e68 0%, transparent 55%),
        linear-gradient(145deg, #050b19, #07152d, #030814);
    color: white;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 15px;
}

/* Background effects */

body::before {
    content: "";
    position: fixed;
    width: 260px;
    height: 260px;
    background: #1265ff;
    filter: blur(130px);
    opacity: .18;
    top: -100px;
    left: -100px;
}

body::after {
    content: "";
    position: fixed;
    width: 250px;
    height: 250px;
    background: #00bfff;
    filter: blur(140px);
    opacity: .12;
    bottom: -100px;
    right: -100px;
}

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 390px;
    text-align: center;
    padding: 25px 20px;
    border: 1px solid rgba(74,151,255,.24);
    border-radius: 25px;
    background: linear-gradient(
        145deg,
        rgba(20,46,91,.72),
        rgba(5,14,32,.94)
    );
    box-shadow:
        0 0 35px rgba(0,105,255,.13),
        inset 0 0 25px rgba(54,146,255,.05);
}

/* Status badge */

.badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 15px;
    border-radius: 30px;
    border: 1px solid rgba(64,160,255,.35);
    background: rgba(25,104,255,.12);
    color: #75c8ff;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 17px;
}

.dot {
    width: 7px;
    height: 7px;
    background: #36e9ff;
    border-radius: 50%;
    box-shadow: 0 0 10px #36e9ff;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    50% { opacity: .25; }
}

/* Logo */

.logo-box {
    width: 100px;
    height: 100px;
    margin: 0 auto 12px;
    border-radius: 23px;
    padding: 4px;
    background: linear-gradient(135deg, #55caff, #1557ff, #142b6c);
    box-shadow: 0 0 28px rgba(27,119,255,.4);
    animation: float 3s ease-in-out infinite;
}

.logo-box img {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    object-fit: cover;
    background: #07152d;
}

@keyframes float {
    50% { transform: translateY(-5px); }
}

/* Branding */

.brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 39px;
    font-weight: 900;
    letter-spacing: 5px;
    background: linear-gradient(90deg, #ffffff, #60c9ff, #ffffff);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
    text-shadow: none;
}

@keyframes shine {
    to { background-position: 200%; }
}

.subtitle {
    margin-top: 7px;
    color: #8eacd7;
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 700;
}

/* Divider */

.line {
    width: 65px;
    height: 3px;
    margin: 18px auto;
    border-radius: 10px;
    background: linear-gradient(90deg, transparent, #29baff, transparent);
}

/* Description */

.heading {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: .5px;
    line-height: 1.4;
}

.description {
    margin-top: 7px;
    font-size: 11px;
    color: #9db1ce;
    line-height: 1.6;
}

/* Liquid bars */

.stats {
    margin-top: 20px;
    padding: 15px;
    border-radius: 15px;
    background: rgba(0,0,0,.20);
    border: 1px solid rgba(77,154,255,.16);
}

.stats-title {
    font-size: 9px;
    letter-spacing: 2px;
    font-weight: 800;
    color: #72bdff;
    margin-bottom: 15px;
}

.bar-item {
    margin-bottom: 13px;
    text-align: left;
}

.bar-item:last-child {
    margin-bottom: 0;
}

.bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    font-weight: 700;
    color: #d5e7ff;
    margin-bottom: 7px;
}

.bar {
    width: 100%;
    height: 7px;
    background: #10264a;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
}

.fill {
    height: 100%;
    width: 0;
    border-radius: 20px;
    background: linear-gradient(
        90deg,
        #1260ff,
        #27baff,
        #91eaff
    );
    background-size: 200% 100%;
    box-shadow: 0 0 12px #168aff;
    animation: load 1.8s ease forwards, liquid 2s linear infinite;
}

.fill.one { --width: 92%; animation-delay: .2s, 0s; }
.fill.two { --width: 85%; animation-delay: .5s, 0s; }
.fill.three { --width: 96%; animation-delay: .8s, 0s; }

@keyframes load {
    to { width: var(--width); }
}

@keyframes liquid {
    to { background-position: 200% 0; }
}

/* CTA */

.join-btn {
    width: 100%;
    margin-top: 21px;
    padding: 17px 10px;
    border: none;
    outline: none;
    border-radius: 13px;
    color: white;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    background: linear-gradient(100deg, #0755e9, #168dff, #0755e9);
    background-size: 200%;
    box-shadow:
        0 5px 22px rgba(0,105,255,.4),
        inset 0 1px 1px rgba(255,255,255,.3);
    cursor: pointer;
    animation: buttonGlow 2.5s infinite;
    transition: .3s;
}

.join-btn:active {
    transform: scale(.97);
}

@keyframes buttonGlow {
    50% {
        box-shadow: 0 5px 30px rgba(0,151,255,.65);
        background-position: 100% 0;
    }
}

.join-btn span {
    margin-left: 8px;
    font-size: 16px;
}

/* Footer */

.footer {
    margin-top: 17px;
    color: #627d9e;
    font-size: 9px;
    letter-spacing: 1px;
}

.footer strong {
    color: #62baff;
}

</style>

<div class="container">

    <div class="badge">
        <span class="dot"></span>
        CRICKET INSIGHTS
    </div>

    <div class="logo-box">
        <img src="logo.png" alt="REDDY Logo">
    </div>

    <h1 class="brand">REDDY</h1>

    <div class="stats">

        </div>

        <div class="bar-item">

            <div class="bar">

        </div>

        <div class="bar-item">

                <span>COMMUNITY UPDATES</span>

            <div class="bar">

    </div>

    <button class="join-btn"

    <div class="footer">
